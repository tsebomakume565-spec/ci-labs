name: Secrets and Env Lab

on:
  push:
    branches: [main]

jobs:
  secure-build:
    runs-on: ubuntu-latest

    # Define environment variables available to all steps in this job
    env:
      APP_ENVIRONMENT: 'staging'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print Environment Variables
        run: |
          echo "Running build for environment: $APP_ENVIRONMENT"
          echo "Current branch: $GITHUB_REF_NAME"

      # Example of using a masked secret (we will configure the secret in GitHub next)
      - name: Check Secret Availability
        env:
          MY_API_KEY: ${{ secrets.PROD_API_KEY }}
        run: |
          if [ -z "$MY_API_KEY" ]; then
            echo "PROD_API_KEY is not set or empty (this is normal if not added yet)."
          else
            echo "PROD_API_KEY is securely loaded and masked!"
          fi