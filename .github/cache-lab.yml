name: Caching Lab

on:
  push:
    branches: [main]

jobs:
    build-with-cache:
      runs-on: ubuntu-latest
      
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
          
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm' # Automatically caches npm dependencies
            
        - name: Install dependencies
          run: npm ci
          
        - name: Run tests
          run: npm test