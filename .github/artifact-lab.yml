name: Artifact Lab

on:
  push:
    branches: [main]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Create a build artifact directory
        run: |
          mkdir build-output
          echo "Build artifact generated at $(date)" > build-output/report.txt
          
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-build-report
          path: build-output/